<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>卡密验证注入器 · 樱花完整版 v3</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(135deg,#fff0f5 0%,#fce4ec 50%,#f8bbd0 100%);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:#5a3e4b;
}
#sakura-canvas{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:0}
.card{
  position:relative;z-index:1;
  background:rgba(255,240,246,.88);backdrop-filter:blur(12px);
  border-radius:24px;padding:36px 30px;width:100%;max-width:480px;
  box-shadow:0 8px 25px rgba(255,123,172,.25);
  border:1px solid rgba(255,182,193,.4);text-align:center;
}
h1{font-size:22px;margin-bottom:6px;color:#e85b89;font-weight:700}
.sub{font-size:13px;color:#c9779d;margin-bottom:26px}
.btn{width:100%;padding:14px;border-radius:14px;border:0;font-size:15px;font-weight:700;cursor:pointer;transition:.2s;margin-bottom:12px}
.btn-primary{background:linear-gradient(135deg,#ffb6d6 0%,#ff8ab7 100%);color:#fff;box-shadow:0 8px 20px rgba(255,138,183,.35)}
.btn-primary:active{transform:scale(.97)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:rgba(255,255,255,.7);color:#e85b89;border:1px solid #ffc1d6}
.file-info{margin-top:16px;padding:14px;background:rgba(255,255,255,.6);border-radius:12px;font-size:12px;color:#c9779d;line-height:1.7;text-align:left;display:none;border:1px solid #ffc1d6}
.file-info.show{display:block}
.file-info b{color:#5a3e4b}
.status{margin-top:16px;padding:12px;border-radius:12px;font-size:13px;display:none;line-height:1.5}
.status.show{display:block}
.status.ok{background:rgba(34,197,94,.08);color:#15803d;border:1px solid rgba(34,197,94,.35)}
.status.err{background:rgba(239,68,68,.08);color:#dc2626;border:1px solid rgba(239,68,68,.35)}
.status.wait{background:rgba(245,158,11,.08);color:#b45309;border:1px solid rgba(245,158,11,.35)}
input[type=file]{display:none}
.step{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;color:#5a3e4b;text-align:left}
.step .num{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#ffb6d6,#ff8ab7);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.note{margin-top:16px;padding:12px;background:rgba(255,255,255,.5);border-radius:12px;border:1px solid #ffc1d6;font-size:12px;color:#c9779d;line-height:1.6;text-align:left}
.test-btn{width:100%;padding:12px;border-radius:12px;border:1px solid #ffc1d6;background:rgba(255,255,255,.7);color:#e85b89;font-size:13px;font-weight:600;cursor:pointer;margin-top:10px}
.test-btn:active{background:rgba(255,255,255,.9)}
</style>
</head>
<body>
<canvas id="sakura-canvas"></canvas>

<div class="card">
  <h1>🔐 卡密验证注入器</h1>
  <div class="sub">一键给任意 HTML 加入樱花完整版卡密验证</div>

  <div class="step"><div class="num">1</div><div>选择要注入的 HTML 文件</div></div>
  <div class="step"><div class="num">2</div><div>点“注入并下载”</div></div>
  <div class="step"><div class="num">3</div><div>用新文件替换原文件</div></div>

  <input type="file" id="fileInput" accept=".html,.htm">

  <button class="btn btn-primary" id="pickBtn" style="margin-top:16px">📁 选择 HTML 文件</button>
  <button class="btn btn-ghost" id="injectBtn" disabled>✨ 注入并下载</button>

  <button class="test-btn" id="testFeedbackBtn">🧪 测试反馈接口连通性</button>

  <div class="note">
    接口信息已内置，无需手动配置。<br>
    注入后包含：卡密验证 · 解绑 · 购卡 · 反馈系统 · 樱花背景。
  </div>

  <div class="file-info" id="fileInfo"></div>
  <div class="status" id="status"></div>
</div>

<script>
// 樱花背景
(function(){
  "use strict";
  var canvas = document.getElementById("sakura-canvas");
  if (!canvas) return;
  var ctx = canvas.getContext("2d");
  var W = window.innerWidth, H = window.innerHeight;
  canvas.width = W; canvas.height = H;
  var COLORS = ["rgba(255,183,197,.85)","rgba(255,192,203,.80)","rgba(255,209,218,.82)","rgba(255,170,185,.78)","rgba(255,195,210,.83)","rgba(253,198,212,.75)"];
  var COUNT = 30, petals = [];
  function Petal(){ this.reset(); }
  Petal.prototype.reset = function(){
    this.x=Math.random()*W; this.y=Math.random()*-H; this.size=Math.random()*8+5;
    this.speedY=Math.random()*1.2+0.4; this.speedX=Math.random()*0.6-0.3;
    this.rotation=Math.random()*Math.PI*2; this.rotationSpeed=(Math.random()-0.5)*0.02;
    this.opacity=Math.random()*0.4+0.5; this.wobbleAmp=Math.random()*1.5+0.5;
    this.wobbleSpeed=Math.random()*0.02+0.01; this.wobbleOffset=Math.random()*Math.PI*2;
    this.color=COLORS[Math.floor(Math.random()*COLORS.length)]; this.time=0;
  };
  Petal.prototype.update = function(){
    this.time++; this.y+=this.speedY;
    this.x+=this.speedX+Math.sin(this.time*this.wobbleSpeed+this.wobbleOffset)*this.wobbleAmp*0.3;
    this.rotation+=this.rotationSpeed;
    if(this.y>H+20||this.x<-20||this.x>W+20){this.reset();this.y=-20;}
  };
  Petal.prototype.draw = function(){
    ctx.save(); ctx.translate(this.x,this.y); ctx.rotate(this.rotation);
    ctx.globalAlpha=this.opacity; var s=this.size; ctx.fillStyle=this.color;
    ctx.beginPath(); ctx.moveTo(0,-s*0.6);
    ctx.bezierCurveTo(s*0.5,-s*0.8,s*0.8,-s*0.2,0,s*0.3);
    ctx.bezierCurveTo(-s*0.8,-s*0.2,-s*0.5,-s*0.8,0,-s*0.6);
    ctx.fill(); ctx.restore();
  };
  for(var i=0;i<COUNT;i++){var p=new Petal();p.y=Math.random()*H;petals.push(p);}
  (function animate(){ctx.clearRect(0,0,W,H);for(var i=0;i<petals.length;i++){petals[i].update();petals[i].draw();}requestAnimationFrame(animate);})();
  window.addEventListener("resize",function(){W=window.innerWidth;H=window.innerHeight;canvas.width=W;canvas.height=H;});
})();

(function(){
  "use strict";

  // ======== 内置接口 ========
  var BUILTIN_API_VERIFY = "https://kx.xiaokekx.workers.dev/api/verify";
  var BUILTIN_API_UNBIND = "https://kx.xiaokekx.workers.dev/api/unbind";
  var BUILTIN_API_FEEDBACK = "https://xiaoke.xiaokettkx.workers.dev/api/feedback";
  var BUILTIN_API_FEEDBACK_MINE = "https://xiaoke.xiaokettkx.workers.dev/api/feedback/mine";
  var BUILTIN_API_FEEDBACK_MSGS = "https://xiaoke.xiaokettkx.workers.dev/api/feedback/messages/";
  var BUILTIN_API_FEEDBACK_REPLY = "https://xiaoke.xiaokettkx.workers.dev/api/feedback/reply";
  var BUILTIN_API_FEEDBACK_READ = "https://xiaoke.xiaokettkx.workers.dev/api/feedback/read";
  var BUILTIN_BUY_URL = "https://www.baidu.com";

  var fileInput = document.getElementById("fileInput");
  var pickBtn = document.getElementById("pickBtn");
  var injectBtn = document.getElementById("injectBtn");
  var fileInfo = document.getElementById("fileInfo");
  var statusEl = document.getElementById("status");
  var testFeedbackBtn = document.getElementById("testFeedbackBtn");

  var selectedFile = null;
  var fileText = "";

  function showStatus(type, msg){
    statusEl.className = "status show " + type;
    statusEl.textContent = msg;
  }
  function hideStatus(){
    statusEl.className = "status";
    statusEl.textContent = "";
  }

  // ======== 测试反馈接口连通性 ========
  testFeedbackBtn.addEventListener("click", function(){
    var did = "HIK-TEST" + Math.floor(Math.random()*9000+1000);
    showStatus("wait", "正在测试反馈接口...");
    fetch(BUILTIN_API_FEEDBACK_MINE + "?device_id=" + did, { cache: "no-store" })
      .then(function(r){
        return r.text().then(function(t){
          var data;
          try { data = JSON.parse(t); } catch(e){ data = t; }
          if(!r.ok){
            showStatus("err", "接口返回 HTTP " + r.status + "：\n" + (typeof data === "string" ? data.slice(0,200) : JSON.stringify(data).slice(0,200)));
            return;
          }
          showStatus("ok", "✅ 反馈接口连通正常，返回：" + JSON.stringify(data).slice(0,200));
        });
      })
      .catch(function(e){
        showStatus("err", "❌ 无法连接反馈接口：" + e.message + "\n\n可能原因：CORS 未允许、域名错误、Worker 未部署。");
      });
  });

  pickBtn.addEventListener("click", function(){
    fileInput.value = "";
    fileInput.click();
  });

  fileInput.addEventListener("change", function(){
    var f = fileInput.files[0];
    if (!f) return;
    selectedFile = f;
    hideStatus();

    var reader = new FileReader();
    reader.onload = function(e){
      fileText = e.target.result;
      var hasBody = /<\/body>/i.test(fileText);
      var hasMask = fileText.indexOf("kmCheckMask") >= 0;
      var size = (fileText.length / 1024).toFixed(1);

      fileInfo.className = "file-info show";
      fileInfo.innerHTML =
        "<div><b>文件名：</b>" + escapeHtml(f.name) + "</div>" +
        "<div><b>大小：</b>" + size + " KB</div>" +
        "<div><b>是否包含 &lt;/body&gt;：</b>" + (hasBody ? "✅ 是" : "❌ 否") + "</div>" +
        "<div><b>是否已注入过：</b>" + (hasMask ? "⚠️ 是（将拒绝重复注入）" : "✅ 否") + "</div>";

      if (hasMask){
        injectBtn.disabled = true;
        showStatus("err", "该文件已经注入过卡密验证，无需重复注入");
      } else {
        injectBtn.disabled = false;
      }
    };
    reader.onerror = function(){ showStatus("err", "文件读取失败"); };
    reader.readAsText(f, "utf-8");
  });

  injectBtn.addEventListener("click", function(){
    if (!selectedFile || !fileText){ showStatus("err", "请先选择 HTML 文件"); return; }
    if (fileText.indexOf("kmCheckMask") >= 0){ showStatus("err", "该文件已注入过"); return; }

    injectBtn.disabled = true;
    showStatus("wait", "正在注入...");

    try {
      var injectCode = buildInjectCode();
      var newText = injectIntoHtml(fileText, injectCode);
      var newName = makeNewName(selectedFile.name);
      downloadFile(newName, newText);
      showStatus("ok", "✅ 注入成功！文件名：" + newName);
    } catch (e) {
      showStatus("err", "注入失败：" + e.message);
    } finally {
      injectBtn.disabled = false;
    }
  });

  // 生成注入代码
  // 关键修复：
  //  1. 反馈弹窗 z-index 提到 2147483648（比 mask 高）

  //  3. 去掉 async/await，全部改 Promise（兼容性更好）

    L("    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function(buf){");
    L("      var arr = Array.from(new Uint8Array(buf));");
    L("      return arr.map(function(x){ return x.toString(16).padStart(2,'0'); }).join('');");

    L("      var r='HIK-';");
    L("      for(var i=0;i<4;i++) r += chars[Math.floor(Math.random()*chars.length)];");

    L("    var COUNT = 40, petals = [];");

    L("    Petal.prototype.reset = function(){");
    L("      this.x=Math.random()*W; this.y=Math.random()*-H; this.size=Math.random()*8+5;");
    L("      this.speedY=Math.random()*1.2+0.4; this.speedX=Math.random()*0.6-0.3;");

    L("    Petal.prototype.update = function(){");
    L("      this.time++; this.y+=this.speedY;");
    L("      this.x+=this.speedX+Math.sin(this.time*this.wobbleSpeed+this.wobbleOffset)*this.wobbleAmp*0.3;");

    L("      ctx.fill(); ctx.restore();");

  function injectIntoHtml(html, code){
    var lower = html.toLowerCase();
    var idx = lower.lastIndexOf("</body>");
    if (idx >= 0) return html.substring(0, idx) + code + "\n" + html.substring(idx);
    var idx2 = lower.lastIndexOf("</html>");
    if (idx2 >= 0) return html.substring(0, idx2) + code + "\n" + html.substring(idx2);
    return html + "\n" + code;
  }

  function makeNewName(name){
    var dot = name.lastIndexOf(".");
    if (dot < 0) return name + "_卡密版";
    return name.substring(0, dot) + "_卡密版" + name.substring(dot);
  }

  function downloadFile(filename, text){
    var blob = new Blob([text], { type: "text/html;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
  }

  function escapeHtml(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
  }
